name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Organize web assets
        run: |
          mkdir -p www/icons
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png icon-maskable-512.png www/icons/
      - name: Add Android platform
        run: npx cap add android
      - name: Allow camera permission in manifest
        run: |
          awk '/<manifest/{print;print "    <uses-permission android:name=\"android.permission.CAMERA\" />";next}1' android/app/src/main/AndroidManifest.xml > tmp.xml
          mv tmp.xml android/app/src/main/AndroidManifest.xml
      - name: Patch MainActivity for camera access
        run: cp MainActivity-patch.java android/app/src/main/java/com/confereai/app/MainActivity.java
      - name: Copy web assets into native project
        run: npx cap copy android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: confere-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
